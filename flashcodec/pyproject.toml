[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcodec"
version = "0.1.0"
description = "把 Transformer 的时序 KV Cache 张量当作高维多媒体图像信号来压缩：JPEG 式频域（DCT）有损 + PNG 式时域差分无损"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "feifei", email = "aifeifei798@gmail.com" }]
keywords = ["kv-cache", "transformer", "dct", "compression", "llm", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/aifeifei798/Mini-Architecture"

[tool.setuptools.packages.find]
include = ["flashcodec*"]
